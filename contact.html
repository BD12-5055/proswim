<div class="loader" id="loader">
  <svg class="loader__svg" id="loaderSvg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="clipLeft">
        <path id="clipLeftPath" />
      </clipPath>
      <clipPath id="clipRight">
        <path id="clipRightPath" />
      </clipPath>
      <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Left blue panel -->
    <rect id="loaderLeft" clip-path="url(#clipLeft)"/>
    <!-- Right blue panel -->
    <rect id="loaderRight" x="0" y="0" width="100%" height="100%" clip-path="url(#clipRight)"
    />
    <!-- White wave line on top -->
    <path
      id="loaderWavePath"
      fill="none"
      stroke="rgba(255,255,255,0.9)"
      stroke-width="2.5"
      stroke-linecap="round"
      filter="url(#waveGlow)"
    />
  </svg>
